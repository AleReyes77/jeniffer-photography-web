# CodeQL: análisis de seguridad del código de GitHub. Busca vulnerabilidades
# conocidas (inyecciones, XSS, rutas inseguras...) en cada cambio y cada semana.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
          paths-ignore: public/vendor
      - uses: github/codeql-action/analyze@v3

# ============================================================
#  Nginx como proxy inverso (VPS con varios sitios).
#  Nginx atiende los puertos públicos 80 y 443 y reparte el tráfico
#  según el dominio: cada sitio Node escucha en su propio puerto local.
#    tudominio.com      → 127.0.0.1:3000  (este sitio)
#    otrositio.com      → 127.0.0.1:3001  (otro proyecto, sin chocar)
#  Copia este archivo a /etc/nginx/sites-available/jeniffer-photography,
#  enlázalo en sites-enabled, ejecuta `sudo nginx -t` y `sudo systemctl reload nginx`.
#  Certificado gratuito: `sudo certbot --nginx -d tudominio.com -d www.tudominio.com`
# ============================================================

# HTTP → HTTPS (permanente)
server {
    listen 80;
    listen [::]:80;
    server_name tudominio.com www.tudominio.com;
    return 301 https://tudominio.com$request_uri;
}

# www → sin www (una sola URL para el SEO)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.tudominio.com;
    ssl_certificate     /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;
    return 301 https://tudominio.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tudominio.com;

    ssl_certificate     /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # No revelar la versión de Nginx
    server_tokens off;
    # Límite del tamaño de las peticiones (el sitio no recibe archivos)
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
